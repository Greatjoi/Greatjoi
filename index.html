<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Hub</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1f2430; --muted:#6b7280; --accent:#4f46e5; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1c1f28; --text:#eceef4; --muted:#9aa1b0; --accent:#818cf8; --line:#2c303c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px; text-align:center; font-size:1.4rem; font-weight:700; }
  nav { display:flex; gap:6px; padding:0 12px 12px; overflow-x:auto; justify-content:center; }
  nav button { border:0; background:var(--card); color:var(--text); padding:10px 16px; border-radius:999px; font-size:1rem; cursor:pointer; border:1px solid var(--line); }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:640px; margin:0 auto; padding:0 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  input, select { padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; flex:1; min-width:110px; }
  .btn { padding:10px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  .row { display:flex; align-items:center; gap:10px; }
  .row .grow { flex:1; }
  .muted { color:var(--muted); font-size:.85rem; }
  .done { text-decoration:line-through; color:var(--muted); }
  .x { background:none; border:0; color:var(--muted); font-size:1.2rem; cursor:pointer; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
  input[type=checkbox] { width:22px; height:22px; flex:none; min-width:0; }
  .score { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .score .card { flex:1; text-align:center; margin:0; min-width:90px; }
  .score b { font-size:1.5rem; display:block; }
  .day { display:flex; gap:12px; align-items:flex-start; }
  .day .ic { font-size:2rem; }
  .day h3 { margin:0; font-size:1.05rem; }
  .links { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .links a { font-size:.85rem; padding:6px 10px; border-radius:999px; border:1px solid var(--line); color:var(--accent); text-decoration:none; background:var(--bg); }
  .home { text-align:center; color:var(--muted); }
  .tip { background:var(--bg); border-radius:10px; padding:8px 10px; margin-top:8px; font-size:.85rem; }
  .wk { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .small { padding:6px 12px; background:var(--card); color:var(--text); border:1px solid var(--line); }
  details summary { cursor:pointer; font-weight:600; }
  .social { background:var(--bg); border-left:3px solid #10b981; border-radius:10px; padding:8px 10px; margin-top:8px; font-size:.85rem; }
  .fav { font-size:.75rem; background:#f59e0b; color:#fff; border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .acts button { font-size:.85rem; padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  .acts label { margin-right:auto; }
</style>
</head>
<body>
<header>🏡 Family Hub</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="toast" class="card" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;max-width:620px;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9">
  <b>💬 Invite message</b><p style="user-select:all;margin:8px 0"></p><div class="muted"></div>
  <button class="btn small" style="margin-top:8px" onclick="this.parentNode.style.display='none'">Close</button></div>

<script>
const COLORS = ["#ef4444","#f59e0b","#10b981","#3b82f6","#a855f7","#ec4899"];
const TABS = [["calendar","📅 Calendar"],["chores","✅ Chores"],["shopping","🛒 Shopping"],["outings","🌳 Outings"],["family","👨‍👩‍👦‍👦 Family"]];

let state;
try { state = JSON.parse(localStorage.getItem("familyhub")); } catch (e) {}
state = state || { tab:"outings", members:[], events:[], chores:[], shopping:[], outings:{ city:'', st:'', season:'auto', week:0, done:{} } };
state.outings = state.outings || { city:'', st:'', season:'auto', week:0, done:{} };
state.outings.favs = state.outings.favs || []; state.outings.friends = state.outings.friends || []; state.outings.swap = state.outings.swap || {};
const save = () => { try { localStorage.setItem("familyhub", JSON.stringify(state)); } catch (e) {} render(); };
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const member = id => state.members.find(m => m.id === id);
const memberOptions = (withAll) => (withAll ? '<option value="">Everyone</option>' : '') +
  state.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
const dot = id => { const m = member(id); return m ? `<span class="dot" style="background:${m.color}"></span> ${esc(m.name)}` : "Everyone"; };

function render() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) =>
    `<button class="${state.tab === k ? "active" : ""}" onclick="state.tab='${k}';save()">${l}</button>`).join("");
  document.getElementById("view").innerHTML = views[state.tab]();
}

const views = {
  outings(){ return outingsView(); },
  calendar() {
    const events = [...state.events].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    return `<form onsubmit="addEvent(event)">
      <input name="title" placeholder="Event (e.g. Soccer practice)" required>
      <input name="date" type="date" required><input name="time" type="time">
      <select name="who">${memberOptions(true)}</select>
      <button class="btn">Add</button></form>` +
      (events.map(e => `<div class="card row"><div class="grow"><b>${esc(e.title)}</b>
        <div class="muted">${esc(e.date)} ${esc(e.time || "")} · ${dot(e.who)}</div></div>
        <button class="x" onclick="del('events','${e.id}')">✕</button></div>`).join("") || '<p class="muted">No events yet.</p>');
  },
  chores() {
    const pts = state.members.map(m => `<div class="card"><b>${state.chores.filter(c => c.done && c.who === m.id).length * 10}</b>
      <span class="dot" style="background:${m.color}"></span> ${esc(m.name)}</div>`).join("");
    return `<div class="score">${pts}</div>
      <form onsubmit="addChore(event)"><input name="title" placeholder="Chore (e.g. Take out trash)" required>
      <select name="who">${memberOptions(false)}</select><button class="btn">Add</button></form>` +
      (state.chores.map(c => `<div class="card row"><input type="checkbox" ${c.done ? "checked" : ""} onchange="toggle('chores','${c.id}')">
        <div class="grow"><span class="${c.done ? "done" : ""}">${esc(c.title)}</span>
        <div class="muted">${dot(c.who)} · 10 pts</div></div>
        <button class="x" onclick="del('chores','${c.id}')">✕</button></div>`).join("") || '<p class="muted">No chores yet. Add family members first!</p>');
  },
  shopping() {
    return `<form onsubmit="addItem(event)"><input name="title" placeholder="Add item (e.g. Milk)" required><button class="btn">Add</button></form>` +
      (state.shopping.map(i => `<div class="card row"><input type="checkbox" ${i.done ? "checked" : ""} onchange="toggle('shopping','${i.id}')">
        <span class="grow ${i.done ? "done" : ""}">${esc(i.title)}</span>
        <button class="x" onclick="del('shopping','${i.id}')">✕</button></div>`).join("") || '<p class="muted">List is empty.</p>') +
      (state.shopping.some(i => i.done) ? '<button class="btn" onclick="clearDone()">Clear checked</button>' : "");
  },
  family() {
    return `<form onsubmit="addMember(event)"><input name="name" placeholder="Name (e.g. Mom)" required><button class="btn">Add</button></form>` +
      (state.members.map(m => `<div class="card row"><span class="dot" style="background:${m.color}"></span>
        <span class="grow">${esc(m.name)}</span><button class="x" onclick="del('members','${m.id}')">✕</button></div>`).join("") ||
        '<p class="muted">Start by adding your wife and sons.</p>');
  }
};


const D = (icon,title,q,tip) => ({icon,title,q,tip});
const SEASONS = {
 spring:{ name:"Spring 🌷", days:[
  [D("📚","Library toddler story time","library story time toddlers","Great first outing with a newborn too. Parents chat after, easy to meet other moms."),D("📖","Bookstore story hour","bookstore children story hour","Many indoor, free, and drop-in."),D("🎵","Baby & me music class","baby music class","Look for drop-in or free trial classes.")],
  [D("🧸","Children's museum","children's museum","Toddler areas are usually separate and gentle."),D("🔬","Science center (toddler zone)","science center kids","Check for a under-3 area."),D("🎨","Art museum family morning","art museum family programs","Many have free stroller-friendly mornings.")],
  [D("🦒","Zoo","zoo","Go in the morning when animals are active and it's cooler."),D("🐐","Petting zoo / animal sanctuary","petting zoo","Spring babies on display."),D("🌸","Botanical garden","botanical garden","Flat paths, great for strollers.")],
  [D("🐠","Aquarium","aquarium","Dim, calm, and toddlers love the tanks."),D("🥾","Nature center walk","nature center kids","Short trails; baby-wearing works well."),D("🛝","Playground picnic","playground near me","Pack a picnic and invite another mom.")],
  [D("🐑","Farm visit (baby animals)","farm visit kids","Lambs and chicks in spring."),D("🌷","Tulip / flower farm","flower farm u-pick","Check bloom dates before you go."),D("🥕","Farmers market","farmers market","Often has kids' activities and music.")]],
  nat:["🌸 Cherry blossoms in Washington, DC","🏞️ National Park wildflowers (Junior Ranger programs)","🏛️ Smithsonian museums (free, stroller-friendly)"] },
 summer:{ name:"Summer ☀️", days:[
  [D("📚","Library summer reading event","library summer reading toddlers","Free and air-conditioned."),D("📖","Bookstore story hour","bookstore children story hour","Indoor break from the heat."),D("🎵","Free concert in the park","free outdoor concert kids","Bring a blanket.")],
  [D("💦","Splash pad","splash pad","Bring swim diapers and a change of clothes."),D("🏊","Baby swim / shallow pool","public pool toddler swim","Check family swim hours."),D("🧸","Children's museum","children's museum","Cool and indoors on hot days.")],
  [D("🦒","Zoo (go early)","zoo","Arrive at opening to beat the heat."),D("🐐","Petting zoo","petting zoo","Shaded and easy."),D("🌳","Shady park & playground","shaded playground","Pick one with trees.")],
  [D("🏖️","Beach / lake day","beach lake kids","Shade tent, sunscreen, and snacks."),D("🐠","Aquarium","aquarium","Cool escape on a very hot day."),D("🥾","Early morning nature walk","nature trail stroller friendly","Go before it gets hot.")],
  [D("🍓","U-pick berry farm","u-pick berry farm","Go early; toddlers love it."),D("🐄","Farm visit","farm visit kids","Check hours and shade."),D("🥕","Farmers market","farmers market","Fresh fruit snack included.")]],
  nat:["🏞️ National Park Junior Ranger badge","🏖️ A national seashore or lakeshore day","🚂 Train or heritage railway ride"] },
 fall:{ name:"Fall 🍂", days:[
  [D("📚","Library toddler story time","library story time toddlers","Easy first outing with a newborn too."),D("📖","Bookstore story hour","bookstore children story hour","Indoor and drop-in."),D("🎵","Baby & me music class","baby music class","Great for meeting parents.")],
  [D("🧸","Children's museum","children's museum","Toddler areas are usually separate."),D("🔬","Science center","science center kids","Check for an under-3 area."),D("🎨","Art museum family morning","art museum family programs","Often stroller friendly.")],
  [D("🎃","Pumpkin patch","pumpkin patch","Great photo spot. Mid-week is quieter."),D("🦒","Zoo","zoo","Cooler weather means active animals."),D("🌽","Fall festival","fall festival kids","Check for toddler-friendly activities.")],
  [D("🍎","Apple orchard","apple orchard u-pick","Cider and donuts too."),D("🍂","Leaf-peeping nature trail","nature trail stroller friendly","Wide paved paths work best."),D("🐠","Aquarium","aquarium","A good rainy-day fallback.")],
  [D("🌽","Farm & hay ride","farm hayride kids","Check for toddler-sized rides."),D("🐄","Farm visit","farm visit kids","Animals and tractors."),D("🥕","Farmers market","farmers market","Seasonal produce and music.")]],
  nat:["🍁 Fall foliage drive (Great Smoky Mountains, New England)","🎃 Famous pumpkin festivals","🦌 National wildlife refuge visit"] },
 winter:{ name:"Winter ❄️", days:[
  [D("📚","Library toddler story time","library story time toddlers","Warm and free."),D("📖","Bookstore story hour","bookstore children story hour","Cozy indoor spot."),D("🎵","Baby & me music class","baby music class","Meet other parents.")],
  [D("🤸","Indoor play gym","indoor play gym toddlers","Look for open-play toddler hours."),D("🧸","Children's museum","children's museum","Warm and engaging."),D("🛝","Mall or indoor play area","indoor playground","Free and easy for a quick outing.")],
  [D("🏛️","Museum","museum family kids","Stroller friendly and heated."),D("🔬","Science center","science center kids","Check for an under-3 area."),D("🐠","Aquarium","aquarium","Warm, with calm lights.")],
  [D("🌴","Conservatory / greenhouse","conservatory botanical garden","A warm tropical escape."),D("🦒","Zoo (indoor exhibits)","zoo","Bundle up and visit indoor exhibits."),D("🥾","Bundled-up park walk","park walk","Short and sweet. Hot cocoa after.")],
  [D("☕","Parent playdate at a cafe","kid friendly cafe","Invite a mom friend from story time."),D("🏊","Indoor pool","indoor pool family swim","Warm water and fun."),D("🎄","Holiday lights / events","holiday lights kids","Check for toddler hours.")]],
  nat:["🎄 Zoo lights events around the country","⛷️ A snow-day trip (sledding, snow play)","🏛️ Smithsonian & museum days in DC"] }
};
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday"];
const SOCIAL=[
 "Stay 10 minutes after. Ask another mom how old her little one is. It's the easiest opener.",
 "Look for the parent who comes back every week. Regulars become friends.",
 "Ask a mom if she'd like to meet here again next week at the same time.",
 "Compliment something (a carrier, a stroller, a snack idea) and ask where she got it.",
 "Ask the staff or librarian if there's a regular parents' group or playgroup.",
 "Swap numbers with one parent you clicked with, then save her under Mom friends below.",
 "Sit near the toddler area. Kids playing side by side start the chat for you.",
 "Mention you have a baby on the way or a newborn. Other moms love to share tips."];
const GROUPS=[
 ["🤱","MOPS / moms groups","MOPS moms group"],
 ["⛪","Church moms & toddler groups","church moms group toddlers"],
 ["📚","Library baby & toddler groups","library baby toddler playgroup"],
 ["🛝","Toddler playgroups","toddler playgroup"],
 ["🍼","Breastfeeding & new-mom circles","new moms support group"],
 ["📅","Meetup mom groups","meetup moms group"]];
function autoSeason(d){ const m=d.getMonth(); return m>=2&&m<=4?"spring":m>=5&&m<=7?"summer":m>=8&&m<=10?"fall":"winter"; }
const mapsUrl=(q,o)=>"https://www.google.com/maps/search/"+encodeURIComponent(q+" near "+o.city+", "+o.st);
const mapsPlace=(q,o)=>"https://www.google.com/maps/search/"+encodeURIComponent(q+", "+o.city+", "+o.st);
const webUrl=q=>"https://www.google.com/search?q="+encodeURIComponent(q);
function outingsView(){
  const o=state.outings;
  if(!o.city||!o.st) return `<div class="card"><h3 style="margin-top:0">Where are you based?</h3>
    <p class="muted">Used to find places near you, such as libraries, museums, zoos, and farms. It stays on this device.</p>
    <form onsubmit="saveLoc(event)"><input name="city" placeholder="City" required><input name="st" placeholder="State" required><button class="btn">Save</button></form></div>`;
  const now=new Date(); const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7)+o.week*7); mon.setHours(12,0,0,0);
  const sk=o.season==="auto"?autoSeason(mon):o.season; const S=SEASONS[sk];
  const wkNum=Math.floor(mon.getTime()/(7*864e5));
  const fmt=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const favsFor=(i)=>o.favs.filter(p=>(p.day==="any"||+p.day===i)&&(p.season==="all"||p.season===sk))
    .map(p=>({icon:"⭐",title:p.name,q:p.name,tip:p.note||"One of your saved favorites.",fav:true}));
  window._wk=[];
  const cards=DAYS.map((name,i)=>{
    const dt=new Date(mon); dt.setDate(mon.getDate()+i); const key=dt.toISOString().slice(0,10);
    const opts=[...S.days[i],...favsFor(i)]; const a=opts[((wkNum+i+(o.swap[key]||0))%opts.length+opts.length)%opts.length];
    const done=!!o.done[key]; const soc=SOCIAL[(wkNum+i)%SOCIAL.length];
    window._wk[i]={title:a.title,day:name,date:fmt(dt)};
    const near=a.fav?mapsPlace(a.q,o):mapsUrl(a.q,o);
    return `<div class="card day"><div class="ic">${a.icon}</div><div class="grow" style="flex:1">
      <div class="muted">${name} · ${fmt(dt)}</div><h3 class="${done?'done':''}">${esc(a.title)}${a.fav?'<span class="fav">Favorite</span>':''}</h3>
      <div class="tip">💡 ${esc(a.tip)}</div>
      <div class="social">👋 <b>Meet parents:</b> ${esc(soc)}</div>
      <div class="links">
        <a target="_blank" rel="noopener" href="${near}">📍 ${a.fav?"Directions":"Near me (≤20 mi)"}</a>
        ${a.fav?"":`<a target="_blank" rel="noopener" href="${webUrl(a.q+' within 30 miles of '+o.city+', '+o.st)}">🚗 20-30 mi</a>
        <a target="_blank" rel="noopener" href="${webUrl('best '+a.q+' for toddlers in '+o.st+' '+sk)}">🗺️ Statewide</a>`}
      </div>
      <div class="acts">
        <label class="row"><input type="checkbox" ${done?"checked":""} onchange="toggleOuting('${key}')"> We went!</label>
        <button onclick="invite(${i})">💬 Invite a mom</button>
        <button onclick="swapDay('${key}')">🔀 Swap</button>
      </div>
    </div></div>`}).join("");
  const weekend=`<div class="card home">🏠 Saturday & Sunday: family home days<br><span class="muted">Everyone together, no plans.</span></div>`;
  return `<div class="wk"><button class="btn small" onclick="state.outings.week--;save()">← Prev</button>
      <b>Week of ${fmt(mon)} · ${S.name}</b><button class="btn small" onclick="state.outings.week++;save()">Next →</button></div>
    <div class="card muted">📍 ${esc(o.city)}, ${esc(o.st)} · Each weekday has a different outing, and the options rotate every week so it never gets stale. They're ideas, and she doesn't have to do them. Weeks with a newborn can be easy: library, park walk, or a cafe playdate.</div>`
    +cards+weekend+
    `<div class="card"><details><summary>🇺🇸 Nationwide bucket-list ideas for ${S.name}</summary><ul>${S.nat.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
      <a target="_blank" rel="noopener" href="${webUrl(sk+' family events kids '+o.st)}">🗺️ ${S.name} family events in ${esc(o.st)}</a></details></div>
    ${parentsCard(o)}
    ${favsCard(o)}
    <div class="card"><details><summary>⚙️ Settings</summary>
      <form onsubmit="saveLoc(event)" style="margin-top:10px"><input name="city" value="${esc(o.city)}" required><input name="st" value="${esc(o.st)}" required><button class="btn">Update place</button></form>
      <select onchange="state.outings.season=this.value;save()">${["auto",...Object.keys(SEASONS)].map(k=>`<option value="${k}" ${o.season===k?"selected":""}>${k==="auto"?"Season: automatic":SEASONS[k].name}</option>`).join("")}</select></details></div>`;
}
function parentsCard(o){
  return `<div class="card"><details><summary>👋 Meet other parents (${o.friends.length} mom friend${o.friends.length===1?"":"s"})</summary>
    <p class="muted">Recurring groups are the fastest way to make mom friends because you see the same faces each week.</p>
    <div class="links">${GROUPS.map(g=>`<a target="_blank" rel="noopener" href="${webUrl(g[2]+' near '+o.city+', '+o.st)}">${g[0]} ${g[1]}</a>`).join("")}</div>
    <h4 style="margin:14px 0 6px">💛 Mom friends</h4>
    <form onsubmit="addFriend(event)"><input name="name" placeholder="Name" required><input name="note" placeholder="Where you met / kids' ages"><button class="btn">Add</button></form>
    ${o.friends.map(p=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${esc(p.note||"")}</div></div>
      <button class="x" onclick="delO('friends','${p.id}')">✕</button></div>`).join("")||'<p class="muted">No one yet. Add a mom you meet so you remember to invite her.</p>'}
  </details></div>`;
}
function favsCard(o){
  const dayOpt=`<option value="any">Any weekday</option>`+DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("");
  const sOpt=`<option value="all">All year</option>`+Object.keys(SEASONS).map(k=>`<option value="${k}">${SEASONS[k].name}</option>`).join("");
  return `<div class="card"><details><summary>⭐ Our favorite places (${o.favs.length})</summary>
    <p class="muted">Save places you love. They join the rotation for that day and season, marked ⭐.</p>
    <form onsubmit="addFav(event)"><input name="name" placeholder="Place (e.g. Lebanon Library)" required>
      <select name="day">${dayOpt}</select><select name="season">${sOpt}</select>
      <input name="note" placeholder="Note (e.g. story time 10:30)"><button class="btn">Save</button></form>
    ${o.favs.map(p=>`<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div class="grow"><b>⭐ ${esc(p.name)}</b>
      <div class="muted">${p.day==="any"?"Any weekday":DAYS[+p.day]} · ${p.season==="all"?"All year":SEASONS[p.season].name}${p.note?" · "+esc(p.note):""}</div></div>
      <button class="x" onclick="delO('favs','${p.id}')">✕</button></div>`).join("")}
  </details></div>`;
}
function addFav(e){ state.outings.favs.push({id:uid(),...f(e)}); save(); }
function addFriend(e){ state.outings.friends.push({id:uid(),...f(e)}); save(); }
function delO(list,id){ state.outings[list]=state.outings[list].filter(x=>x.id!==id); save(); }
function swapDay(k){ state.outings.swap[k]=(state.outings.swap[k]||0)+1; save(); }
function invite(i){
  const w=window._wk[i]; const msg=`Hi! We're going to ${w.title} on ${w.day} (${w.date}). Want to bring the kids and join us?`;
  const t=document.getElementById("toast"); t.querySelector("p").textContent=msg; t.style.display="block";
  const st=t.querySelector(".muted");
  try { navigator.clipboard.writeText(msg).then(()=>st.textContent="✅ Copied! Paste it into a text to her.",()=>st.textContent="Press and hold the message to copy it."); }
  catch(e){ st.textContent="Press and hold the message to copy it."; }
}
function saveLoc(e){ const v=f(e); state.outings.city=v.city.trim(); state.outings.st=v.st.trim(); save(); }
function toggleOuting(k){ state.outings.done[k]=!state.outings.done[k]; save(); }

const f = e => { e.preventDefault(); return Object.fromEntries(new FormData(e.target)); };
function addEvent(e) { state.events.push({ id: uid(), ...f(e) }); save(); }
function addChore(e) { state.chores.push({ id: uid(), done:false, ...f(e) }); save(); }
function addItem(e) { state.shopping.push({ id: uid(), done:false, ...f(e) }); save(); }
function addMember(e) { state.members.push({ id: uid(), name: f(e).name, color: COLORS[state.members.length % COLORS.length] }); save(); }
function del(list, id) { state[list] = state[list].filter(x => x.id !== id); save(); }
function toggle(list, id) { const x = state[list].find(x => x.id === id); x.done = !x.done; save(); }
function clearDone() { state.shopping = state.shopping.filter(i => !i.done); save(); }

render();
</script>
</body>
</html>
