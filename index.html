<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Hub Outings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, confident, like a family picture book
   IDEA: a picture-book week planner, one illustrated page per day
   PICTURE: a big hand-drawn scene of the chosen day's outing (or her own photo)
   COLOUR and TYPE: season colours lead the band (spring green, summer blue, fall rust, winter navy); Fredoka + Nunito
   LAYOUT: season band with week calendar strip, big day page, whole-week list, bottom tab bar */
:root{color-scheme:light dark;--bg:light-dark(#fffaf2,#15130f);--card:light-dark(#ffffff,#211e19);--ink:light-dark(#1d1a16,#f5efe6);--mut:light-dark(#6f665b,#b3a998);--line:light-dark(#efe5d6,#34302a);--band:#2f8f5b;--acc:#ff6f91;--soft:light-dark(#fff3e4,#2a251e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;padding-bottom:88px}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;margin:0;line-height:1.08;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
.band{background:var(--band);color:#fff;padding:18px max(4vw,14px) 22px;transition:background .4s}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:clamp(26px,6vw,36px);font-weight:700}
.sub{opacity:.9;font-weight:700;font-size:14px}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;border-radius:50%;border:2px solid #ffffff66;background:#ffffff1f;color:#fff;font-size:20px;cursor:pointer}
.nav button:focus-visible,.cell:focus-visible,.btn:focus-visible,.chip:focus-visible,.tabs button:focus-visible{outline:3px solid #ffd34d;outline-offset:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}
.cell{border:0;border-radius:16px;background:#ffffff26;color:#fff;padding:8px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px}
.cell .dn{font-size:12px;font-weight:800;opacity:.85}
.cell .dd{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:20px;font-weight:600;line-height:1}
.cell .th{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid #ffffff80;position:relative}
.cell .th svg,.cell .th img{width:100%;height:100%;display:block;object-fit:cover}
.cell .ok{position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border-radius:50%;background:#22c55e;color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #fff}
.cell.on{background:#fff;color:var(--band)}
.cell.on .th{border-color:var(--band)}
.cell.today .dn::after{content:" •"}
main{max-width:760px;margin:0 auto;padding:0 max(4vw,14px)}
.page{background:var(--card);border-radius:24px;margin-top:-6px;overflow:hidden;box-shadow:0 10px 30px #0000001a;border:1px solid var(--line);position:relative;top:14px}
.hero{aspect-ratio:16/10;position:relative;background:var(--soft)}
.hero svg,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:14px;top:14px;background:#fff;color:#1d1a16;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 2px 8px #0002}
.tag.fav{background:#f59e0b;color:#fff;left:auto;right:14px}
.body{padding:18px 18px 20px}
.body h2{font-size:clamp(26px,6.5vw,34px);font-weight:700}
.when{color:var(--mut);font-weight:800;font-size:14px;margin-bottom:6px}
.note{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:15px}
.note b{display:block;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:16px;margin-bottom:2px}
.n1{background:var(--soft)}
.n2{background:light-dark(#e8f8ef,#17281f)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:14px;text-decoration:none;color:var(--ink);cursor:pointer}
.chip.go{background:var(--band);border-color:var(--band);color:#fff}
.chip.done{background:#22c55e;border-color:#22c55e;color:#fff}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:14px;background:var(--band);color:#fff;font-weight:800;cursor:pointer}
h3.sec{font-size:22px;font-weight:600;margin:40px 0 10px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;cursor:pointer;text-align:start;width:100%}
.item .pic{width:92px;flex:none;aspect-ratio:16/11;border-radius:12px;overflow:hidden;position:relative}
.item .pic svg,.item .pic img{width:100%;height:100%;display:block;object-fit:cover}
.item .t{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:17px;line-height:1.15}
.item .d{font-size:13px;color:var(--mut);font-weight:800}
.item .s{margin-left:auto;font-size:13px;font-weight:800;color:#16a34a;padding-right:6px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.mut{color:var(--mut);font-size:14px}
form{display:grid;gap:8px;margin-top:10px}
input,select{min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:16px;width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li .ph{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft);overflow:hidden}
.li .ph svg{width:100%;height:100%}
.li .g{flex:1}
.x{width:44px;height:44px;border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;flex:none}
.grp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.grp a{display:block;padding:12px;border-radius:14px;background:var(--soft);color:var(--ink);text-decoration:none;font-weight:800;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;max-width:130px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--mut);padding:6px 0;cursor:pointer;min-height:52px}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--band)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.seg button.on{background:var(--band);border-color:var(--band);color:#fff}
.bud{margin-top:14px;background:#00000024;border-radius:16px;padding:10px 12px}
.bt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.bt.sm{margin-top:8px;font-size:13px;opacity:.95}
.meter{height:10px;border-radius:99px;background:#ffffff40;margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;border-radius:99px}
.mini{min-height:36px;padding:0 12px;border-radius:999px;border:2px solid #ffffff80;background:none;color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.mini.on{background:#fff;color:var(--band);border-color:#fff}
.cost{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap;vertical-align:middle}
.c0{background:#dcfce7;color:#166534}.c1{background:#fef9c3;color:#854d0e}.c2{background:#ffedd5;color:#9a3412}.c3{background:#fee2e2;color:#991b1b}
.price{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:10px;font-weight:800;font-size:15px}.price .mut{width:100%;font-weight:600;font-size:13px}
.spend{margin-top:14px;background:var(--soft);border-radius:16px;padding:12px 14px;gap:6px}.spend label{font-family:Fredoka,Nunito,sans-serif;font-weight:600}
.sprow{display:flex;align-items:center;gap:8px}.sprow span{font-weight:800}
.item .s2{margin-left:auto}.item .s2+.s{margin-left:0}
.tog{display:flex;align-items:center;gap:10px;font-weight:800;min-height:44px}
.chk{width:24px;height:24px;flex:none;min-height:0;accent-color:var(--band)}
.strike{text-decoration:line-through;color:var(--mut)}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:84px;max-width:560px;margin:0 auto;z-index:9;box-shadow:0 10px 30px #0004}
.home-h{font-size:clamp(26px,6.5vw,34px)}
@media(prefers-reduced-motion:no-preference){.hero.anim>*{animation:pop .4s ease}@keyframes pop{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}}
@media(max-width:420px){.cell .dd{font-size:17px}.cell{border-radius:12px}.cal{gap:4px}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="toast" class="card"><b class="f" style="font-size:18px">Invite message</b><p id="tmsg" style="user-select:all;margin:8px 0"></p><div class="mut" id="tst"></div><div class="row"><button class="btn" id="tclose">Close</button></div></div>
<script>
{
// ---------- state ----------
let state;
try { state = JSON.parse(localStorage.getItem("familyhub")); } catch (e) {}
state = state || {};
state.tab = ["week","parents","favs","family","settings"].includes(state.tab) ? state.tab : "week";
state.members = state.members || []; state.events = state.events || []; state.chores = state.chores || []; state.shopping = state.shopping || [];
const o = state.outings = state.outings || {};
o.city = o.city || ""; o.st = o.st || ""; o.season = o.season || "auto"; o.week = 0;
o.done = o.done || {}; o.favs = o.favs || []; o.friends = o.friends || []; o.swap = o.swap || {}; o.photos = o.photos || {}; o.spent = o.spent || {}; o.budget = o.budget || {week:0, day:0, freeOnly:false};
state.ftab = state.ftab || "calendar";
let sel = null, anim = false;

const toast = (msg, status) => { document.getElementById("tmsg").textContent = msg; document.getElementById("tst").textContent = status || ""; document.getElementById("toast").style.display = "block"; };
document.getElementById("tclose").onclick = () => document.getElementById("toast").style.display = "none";
function save() {
  try { localStorage.setItem("familyhub", JSON.stringify(state)); }
  catch (e) { toast("Your phone's storage for this page is full. Remove a few photos to add more.", ""); }
  render();
}
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okPhoto = u => typeof u === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u);

// ---------- palettes ----------
const PAL = {
  spring:{band:"#2f8f5b",acc:"#ff6f91",sky:["#a8e0ff","#e8f7ff"],sun:"#ffd34d",g1:"#86d06f",g2:"#5fb45a",tree:"#3f9b4f",name:"Spring"},
  summer:{band:"#0a74c4",acc:"#ff8a00",sky:["#4dbdff","#c4ecff"],sun:"#ffd23f",g1:"#94d36c",g2:"#6cba4c",tree:"#2f8f3f",name:"Summer"},
  fall:{band:"#a8400f",acc:"#e11d48",sky:["#ffbf7a","#ffeccf"],sun:"#fff1b8",g1:"#d8a548",g2:"#b8822c",tree:"#d9622b",name:"Fall"},
  winter:{band:"#1e3a7a",acc:"#e11d48",sky:["#9ec5ee","#e7f1fb"],sun:"#ffffff",g1:"#f4f8fc",g2:"#d6e3f1",tree:"#2f6b5a",name:"Winter"}
};

// ---------- illustrations ----------
let gid = 0;
const tri = (x, y, s, c) => `<rect x="${x-3}" y="${y}" width="6" height="${s*.7}" fill="#7c4a1e"/><path d="M${x-s} ${y+2}L${x} ${y-s*2.2}L${x+s} ${y+2}Z" fill="${c}"/>`;
const building = (wall, roof, door) => `<rect x="96" y="88" width="128" height="70" fill="${wall}"/><path d="M84 90L160 52L236 90Z" fill="${roof}"/>` +
  [108,132,180,204].map(x => `<rect x="${x}" y="96" width="9" height="58" fill="#fff" opacity=".8"/>`).join("") +
  `<rect x="148" y="116" width="24" height="42" rx="12" fill="${door}"/><rect x="88" y="156" width="144" height="7" rx="2" fill="#0000002a"/>`;
const cube = (x, y, s, c, l) => `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="6" fill="${c}"/><text x="${x+s/2}" y="${y+s*.72}" font-size="${s*.6}" text-anchor="middle" fill="#fff" font-family="Fredoka, Nunito, sans-serif" font-weight="700">${l}</text>`;
const fish = (x, y, s, c) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="22" ry="12" fill="${c}"/><path d="M18 0L34-12V12Z" fill="${c}"/><circle cx="-10" cy="-3" r="3.2" fill="#fff"/><circle cx="-10.5" cy="-3" r="1.6" fill="#111"/></g>`;
const pk = (x, y, r) => `<ellipse cx="${x}" cy="${y}" rx="${r*1.3}" ry="${r}" fill="#f97316"/><ellipse cx="${x}" cy="${y}" rx="${r*.45}" ry="${r}" fill="#fdba74" opacity=".5"/><rect x="${x-2}" y="${y-r-7}" width="4" height="9" rx="2" fill="#4d7c0f"/>`;
const note = (x, y, c) => `<ellipse cx="${x}" cy="${y}" rx="9" ry="7" fill="${c}" transform="rotate(-20 ${x} ${y})"/><rect x="${x+6}" y="${y-38}" width="3.5" height="38" fill="${c}"/><path d="M${x+9} ${y-38}q14 6 12 20q-3-10-12-11z" fill="${c}"/>`;
const ART = {
  library: p => ({fg: building("#f6e6c8","#b45309","#7c2d12") + `<g transform="translate(240 150)"><rect width="46" height="10" rx="2" fill="#ef4444"/><rect x="4" y="-10" width="40" height="10" rx="2" fill="#3b82f6"/><rect x="-2" y="-20" width="44" height="10" rx="2" fill="#f59e0b"/><rect x="6" y="-30" width="34" height="10" rx="2" fill="#10b981"/></g>`}),
  museum: p => ({fg: building("#eceff3","#475569","#1e293b") + `<line x1="160" y1="52" x2="160" y2="28" stroke="#334155" stroke-width="2.5"/><path d="M160 28h22l-6 7 6 7h-22z" fill="${p.acc}"/>`}),
  blocks: p => ({fg: cube(102,118,40,"#ef4444","A") + cube(146,118,40,"#3b82f6","B") + cube(124,76,40,"#f59e0b","C") + `<circle cx="226" cy="140" r="20" fill="${p.acc}"/><path d="M206 140h40M226 120c10 10 10 30 0 40" stroke="#fff" stroke-width="3" fill="none"/>`}),
  zoo: p => ({fg: tri(64,128,26,p.tree) + `${[150,160,192,202].map(x=>`<rect x="${x}" y="126" width="7" height="34" rx="3" fill="#e0a13a"/>`).join("")}<ellipse cx="176" cy="122" rx="34" ry="17" fill="#f2b544"/><path d="M196 116L216 58L227 61L211 122Z" fill="#f2b544"/><ellipse cx="229" cy="57" rx="15" ry="8" fill="#f2b544"/><path d="M224 50l-2-10M231 50l1-10" stroke="#8a4b12" stroke-width="3" stroke-linecap="round"/><circle cx="236" cy="55" r="2" fill="#111"/>${[[165,116],[182,126],[194,114],[212,80],[208,98],[156,126]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="#b8691f"/>`).join("")}`}),
  fish: p => ({bg: `<rect width="320" height="200" fill="#0b78bf"/><rect width="320" height="70" fill="#47b3ef" opacity=".55"/><path d="M0 180Q160 164 320 180V200H0Z" fill="#e9cc8e"/>`,
    fg: `<path d="M40 182q-12-30 4-60q12-24-2-44M64 182q10-26-4-50M268 182q-14-34 6-70" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round"/>` + fish(130,90,1.4,"#ff8a3d") + fish(210,130,1,"#facc15") + fish(220,62,.8,"#f472b6") + fish(96,144,.7,"#a78bfa") + [[112,60,5],[118,44,3],[200,40,4],[252,100,3]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>`).join("")}),
  farm: p => ({fg: `<rect x="112" y="96" width="96" height="62" fill="#c0392b"/><path d="M102 100L160 62L218 100Z" fill="#8e2a20"/><rect x="142" y="118" width="36" height="40" fill="#fff"/><path d="M142 118L178 158M178 118L142 158" stroke="#c0392b" stroke-width="4"/><rect x="220" y="84" width="30" height="74" fill="#d6d3d1"/><path d="M220 84a15 15 0 0 1 30 0Z" fill="#78716c"/>` + [24,48,72].map(x=>`<rect x="${x}" y="138" width="5" height="24" fill="#fff"/>`).join("") + `<rect x="18" y="142" width="64" height="4" fill="#fff"/><rect x="18" y="152" width="64" height="4" fill="#fff"/><ellipse cx="270" cy="158" rx="16" ry="11" fill="#fff"/><circle cx="286" cy="152" r="7" fill="#3f3f46"/>`}),
  flowers: p => ({fg: [0,1].map(r => Array.from({length:9},(_, i) => { const x = 28 + i*33 + r*16, y = 140 + r*16, c = [p.acc,"#facc15","#f472b6","#a855f7"][(i+r)%4];
    return `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+28}" stroke="#2f7d32" stroke-width="3"/><path d="M${x-8} ${y}Q${x-9} ${y-15} ${x-4} ${y-17}L${x} ${y-10}L${x+4} ${y-17}Q${x+9} ${y-15} ${x+8} ${y}Q${x} ${y+6} ${x-8} ${y}Z" fill="${c}"/>`; }).join("")).join("")}),
  park: p => ({fg: tri(270,124,24,p.tree) + `<path d="M40 160L62 92L84 160M62 92h60M100 160L122 92L144 160" stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M80 92v34M104 92v34" stroke="#94a3b8" stroke-width="2"/><rect x="74" y="124" width="36" height="6" rx="3" fill="${p.acc}"/><rect x="162" y="96" width="36" height="8" rx="2" fill="#f59e0b"/><path d="M166 104v56M194 104v56M166 116h28M166 130h28M166 144h28" stroke="#64748b" stroke-width="4"/><path d="M196 100q30 4 40 56" stroke="${p.acc}" stroke-width="11" fill="none" stroke-linecap="round"/>`}),
  splash: p => ({fg: `<ellipse cx="160" cy="166" rx="128" ry="16" fill="#7dd3fc"/>` + [[100,-26],[100,26],[160,-34],[160,34],[220,-26],[220,26]].map(([x,d])=>`<path d="M${x} 164Q${x+d} 86 ${x+d*1.6} 164" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round"/>`).join("") + [[120,84],[200,90],[160,70],[90,110],[240,112]].map(([x,y])=>`<path d="M${x} ${y-8}q6 9 0 14q-6-5 0-14z" fill="#0ea5e9"/>`).join("")}),
  pool: p => ({bg: `<rect width="320" height="200" fill="#e0f2fe"/>${Array.from({length:8},(_, i)=>`<path d="M${i*40} 0v100" stroke="#bae6fd" stroke-width="2"/>`).join("")}<rect y="96" width="320" height="104" fill="#38bdf8"/><path d="M0 100q20-8 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" stroke="#e0f2fe" stroke-width="4" fill="none"/>`,
    fg: `<circle cx="196" cy="128" r="24" fill="none" stroke="${p.acc}" stroke-width="12"/><circle cx="196" cy="128" r="24" fill="none" stroke="#fff" stroke-width="12" stroke-dasharray="12 26"/><path d="M60 40v90M86 40v90M60 60h26M60 82h26M60 104h26" stroke="#94a3b8" stroke-width="5"/>`}),
  beach: p => ({bg: `<defs><linearGradient id="bk${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sky[0]}"/><stop offset="1" stop-color="${p.sky[1]}"/></linearGradient></defs><rect width="320" height="200" fill="url(#bk${gid})"/><circle cx="262" cy="44" r="20" fill="${p.sun}"/><rect y="104" width="320" height="50" fill="#0ea5e9"/><path d="M0 112q40-6 80 0t80 0t80 0t80 0" stroke="#bae6fd" stroke-width="3" fill="none"/><path d="M0 146Q160 128 320 146V200H0Z" fill="#fde68a"/>`,
    fg: `<line x1="150" y1="78" x2="164" y2="170" stroke="#57534e" stroke-width="4"/><path d="M96 92Q150 40 206 70Z" fill="${p.acc}"/><path d="M134 74Q150 48 168 52L170 80Z" fill="#fff"/><path d="M222 154h28l-4 22h-20z" fill="#f43f5e"/><path d="M226 154q10-14 20 0" stroke="#f43f5e" stroke-width="3" fill="none"/>`}),

const autoSeason = d => { const m = d.getMonth(); return m>=2&&m<=4?"spring":m>=5&&m<=7?"summer":m>=8&&m<=10?"fall":"winter"; };

function weekData() {
  const now = new Date(); const mon = new Date(now); mon.setHours(12,0,0,0); mon.setDate(now.getDate() - ((now.getDay()+6)%7) + o.week*7);
  const sk = o.season === "auto" ? autoSeason(mon) : o.season; const p = PAL[sk];
  const wk = Math.floor(mon.getTime() / (7*864e5));
  const todayKey = new Date(new Date().setHours(12,0,0,0)).toISOString().slice(0,10);
  const B = o.budget; let spentBefore = 0;
  const days = DAYS.map((name, i) => {
    const dt = new Date(mon); dt.setDate(mon.getDate() + i); const key = dt.toISOString().slice(0,10);
    if (i > 4) { spentBefore += +o.spent[key] || 0; return {i, name, dt, key, home:true, a:{k:"home", title:"Home together", tip:"Everyone together, no plans. Rest up for next week.", c:0}}; }
    const favs = o.favs.filter(f => (f.day === "any" || +f.day === i) && (f.season === "all" || f.season === sk))
      .map(f => ({k:"park", title:f.name, q:f.name, tip:f.note || "One of your saved favorites.", fav:true, photo:f.photo, c:+f.cost||0}));
    const all = [...SEASONS[sk][i], ...favs];
    const left = B.week ? B.week - spentBefore : Infinity;
    const cap = B.freeOnly ? 0 : Math.min(B.day || Infinity, left);
    let opts = all.filter(x => COSTV[x.c] <= cap); if (!opts.length) opts = all.filter(x => x.c === 0);
    spentBefore += +o.spent[key] || 0;
    const n = opts.length, a = opts[(((wk + i + (o.swap[key]||0)) % n) + n) % n];
    return {i, name, dt, key, a, soc: SOCIAL[(wk+i) % SOCIAL.length]};
  });
  const spent = days.reduce((t, d) => t + (+o.spent[d.key] || 0), 0);
  return {mon, sk, p, days, todayKey, spent};
}

  <main>
    <div class="page"><div class="hero ${anim?"anim":""}">${art(a.k, p, photo)}<span class="tag">${d.home ? "Family day" : p.name + " outing · " + COST[a.c]}</span>${a.fav ? '<span class="tag fav">★ Favorite</span>' : ""}</div><div class="body">${body}</div></div>
    <h3 class="sec">The whole week</h3><div class="list">${list}</div>
    <h3 class="sec">Bucket list: ${p.name} trips</h3>
    <div class="card"><div class="list" style="gap:0">${NAT[W.sk].map(n => `<div class="li"><span class="g" style="font-weight:700">${esc(n)}</span></div>`).join("")}</div>
      <div class="row"><a class="chip go" target="_blank" rel="noopener" href="${web(W.sk + " family events kids " + o.st)}">${p.name} family events in ${esc(o.st)}</a></div></div>
    <p class="mut" style="margin-top:18px">These are ideas, not a to-do list. With a newborn, easy weeks are perfect: library, a park walk, or a cafe playdate.</p>
  </main>`;
}
const money = n => (+n).toFixed(+n % 1 ? 2 : 0);
function budgetBar(W) {
  const B = o.budget, free = W.days.slice(0,5).filter(d => d.a.c === 0).length;
  const left = B.week ? B.week - W.spent : 0, pct = B.week ? Math.min(100, W.spent / B.week * 100) : 0;
  return `<div class="bud">
    ${B.week ? `<div class="bt"><b>$${money(W.spent)} spent of $${money(B.week)}</b><span>${left >= 0 ? "$" + money(left) + " left" : "$" + money(-left) + " over"}</span></div>
      <div class="meter"><i style="width:${pct}%;background:${left < 0 ? "#fca5a5" : "#fff"}"></i></div>`
    : `<div class="bt"><b>${W.spent ? "$" + money(W.spent) + " spent this week" : "No budget set"}</b><button class="mini" data-tab="settings" data-go="budget">Set a budget</button></div>`}
    <div class="bt sm"><span>${free} of 5 weekday ideas are free${B.day ? " · up to $" + money(B.day) + " a day" : ""}</span>
      <button class="mini ${B.freeOnly ? "on" : ""}" data-free="1" aria-pressed="${B.freeOnly}">${B.freeOnly ? "✓ Free only" : "Free only"}</button></div></div>`;
}
function plainBand(title, sub, p) { return `<div class="band" style="background:${p.band}"><div class="wrap"><div class="sub">${sub}</div><h1>${title}</h1></div></div>`; }
function parentsView() {
  const p = weekData().p;
  return plainBand("Meet other parents", "Mom friends make every outing better", p) + `<main>
    <div class="card"><h2 style="font-size:22px">Recurring groups near you</h2><p class="mut">Seeing the same faces every week is the fastest way to make friends.</p>
      <div class="grp">${GROUPS.map(g => `<a target="_blank" rel="noopener" href="${web(g[1] + " near " + where())}">${g[0]}</a>`).join("")}</div></div>
    <div class="card"><h2 style="font-size:22px">Mom friends</h2><p class="mut">Save the moms you meet so you remember to invite them.</p>
      <form data-f="friend"><input name="name" placeholder="Name" required><input name="note" placeholder="Where you met, kids' ages"><button class="btn">Add friend</button></form>
      <div style="margin-top:10px">${o.friends.map(f => `<div class="li"><div class="g"><b>${esc(f.name)}</b><div class="mut">${esc(f.note)}</div></div><button class="x" data-del="friends:${esc(f.id)}" aria-label="Remove">✕</button></div>`).join("") || '<p class="mut">No one yet. Add the first mom you meet at story time.</p>'}</div></div>
  </main>`;
}
function favsView() {
  const p = weekData().p;
  return plainBand("Our favorite places", "They join the weekly rotation", p) + `<main>
    <div class="card"><h2 style="font-size:22px">Add a place you love</h2>
      <form data-f="fav"><input name="name" placeholder="Place (e.g. Lebanon Community Library)" required>
        <div class="two"><select name="day"><option value="any">Any weekday</option>${DAYS.slice(0,5).map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select>
        <select name="season"><option value="all">All year</option>${Object.keys(PAL).map(k=>`<option value="${k}">${PAL[k].name}</option>`).join("")}</select></div>
        <select name="cost">${COST.map((c,i)=>`<option value="${i}">${i ? c + " · " + COSTR[i] : "Free"}</option>`).join("")}</select>
        <input name="note" placeholder="Note (e.g. story time Tue 10:30)">
        <label class="mut">Photo (optional)<input type="file" name="photo" accept="image/*" style="padding-top:9px"></label>
        <button class="btn">Save place</button></form></div>
    <div class="card">${o.favs.map(f => `<div class="li"><span class="ph">${okPhoto(f.photo) ? `<img src="${f.photo}" alt="" style="width:100%;height:100%;object-fit:cover">` : art("park", p)}</span>
      <div class="g"><b>★ ${esc(f.name)}</b> ${costTag(+f.cost||0)}<div class="mut">${f.day === "any" ? "Any weekday" : esc(DAYS[+f.day])} · ${PAL[f.season] ? PAL[f.season].name : "All year"}${f.note ? " · " + esc(f.note) : ""}</div></div>
      <button class="x" data-del="favs:${esc(f.id)}" aria-label="Remove">✕</button></div>`).join("") || '<p class="mut">No favorites yet. When you find a spot you love, save it here and it will show up in the week.</p>'}</div>
  </main>`;
}
const member = id => state.members.find(m => m.id === id);
const COLORS = ["#ef4444","#f59e0b","#10b981","#3b82f6","#a855f7","#ec4899"];
const mopts = all => (all ? '<option value="">Everyone</option>' : "") + state.members.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
const who = id => { const m = member(id); return m ? `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${COLORS.includes(m.color)?m.color:"#999"}"></span> ${esc(m.name)}` : "Everyone"; };
function familyView() {
  const p = weekData().p, t = state.ftab;
  const seg = [["calendar","Calendar"],["chores","Chores"],["shopping","Shopping"],["members","Members"]].map(([k,l]) => `<button class="${t===k?"on":""}" data-ftab="${k}">${l}</button>`).join("");
  let c = "";
  if (t === "calendar") c = `<form data-f="event"><input name="title" placeholder="Event (e.g. Pediatrician)" required><div class="two"><input name="date" type="date" required><input name="time" type="time"></div><select name="who">${mopts(true)}</select><button class="btn">Add event</button></form>` +
    ([...state.events].sort((a,b) => ((a.date||"")+(a.time||"")).localeCompare((b.date||"")+(b.time||""))).map(e => `<div class="li"><div class="g"><b>${esc(e.title)}</b><div class="mut">${esc(e.date)} ${esc(e.time)} · ${who(e.who)}</div></div><button class="x" data-del2="events:${esc(e.id)}">✕</button></div>`).join("") || '<p class="mut">No events yet.</p>');
  if (t === "chores") c = `<form data-f="chore"><input name="title" placeholder="Chore (e.g. Take out trash)" required><select name="who">${mopts(false)}</select><button class="btn">Add chore</button></form>` +
    (state.chores.map(x => `<div class="li"><input class="chk" type="checkbox" ${x.done?"checked":""} data-tog="chores:${esc(x.id)}"><div class="g"><span class="${x.done?"strike":""}">${esc(x.title)}</span><div class="mut">${who(x.who)}</div></div><button class="x" data-del2="chores:${esc(x.id)}">✕</button></div>`).join("") || '<p class="mut">No chores yet.</p>');
  if (t === "shopping") c = `<form data-f="item"><input name="title" placeholder="Add item (e.g. Diapers)" required><button class="btn">Add</button></form>` +
    (state.shopping.map(x => `<div class="li"><input class="chk" type="checkbox" ${x.done?"checked":""} data-tog="shopping:${esc(x.id)}"><span class="g ${x.done?"strike":""}">${esc(x.title)}</span><button class="x" data-del2="shopping:${esc(x.id)}">✕</button></div>`).join("") || '<p class="mut">List is empty.</p>') +
    (state.shopping.some(x => x.done) ? '<div class="row"><button class="chip" data-clear="1">Clear checked</button></div>' : "");
  if (t === "members") c = `<form data-f="member"><input name="name" placeholder="Name (e.g. Mom)" required><button class="btn">Add</button></form>` +
    (state.members.map(m => `<div class="li"><span class="g">${who(m.id)}</span><button class="x" data-del2="members:${esc(m.id)}">✕</button></div>`).join("") || '<p class="mut">Add your family.</p>');
  return plainBand("Family", "Calendar, chores and shopping", p) + `<main><div class="seg">${seg}</div><div class="card">${c}</div></main>`;
}
function settingsView() {
  const p = weekData().p, n = Object.keys(o.photos).length + o.favs.filter(f => f.photo).length;
  return plainBand("Settings", "Location and season", p) + `<main><div class="card"><h2 style="font-size:22px">Your area</h2>
    <form data-f="loc"><div class="two"><input name="city" value="${esc(o.city)}" placeholder="City" required><input name="st" value="${esc(o.st)}" placeholder="State" required></div><button class="btn">Update</button></form></div>
    <div class="card" id="budget"><h2 style="font-size:22px">Budget</h2><p class="mut">Set what you're happy to spend. The plan picks ideas that fit, and always has a free one. Leave a box empty for no limit.</p>
      <form data-f="budget"><div class="two"><label class="mut">Per week<div class="sprow"><span>$</span><input name="week" type="number" inputmode="decimal" min="0" step="1" value="${o.budget.week || ""}" placeholder="No limit"></div></label>
      <label class="mut">Per day<div class="sprow"><span>$</span><input name="day" type="number" inputmode="decimal" min="0" step="1" value="${o.budget.day || ""}" placeholder="No limit"></div></label></div>
      <label class="tog"><input class="chk" type="checkbox" name="freeOnly" ${o.budget.freeOnly ? "checked" : ""}> Free outings only</label>
      <button class="btn">Save budget</button></form></div>
    <div class="card"><h2 style="font-size:22px">Season</h2><p class="mut">Automatic follows the calendar. Pick one to preview other seasons.</p>
      <select data-season="1">${["auto",...Object.keys(PAL)].map(k => `<option value="${k}" ${o.season===k?"selected":""}>${k==="auto"?"Automatic":PAL[k].name}</option>`).join("")}</select></div>
    <div class="card"><h2 style="font-size:22px">On this phone</h2><p class="mut">Photos, favorites, friends and checkmarks are saved on this phone only (${n} photo${n===1?"":"s"} saved).</p></div></main>`;
}

const views = {week:weekView, parents:parentsView, favs:favsView, family:familyView, settings:settingsView};
function render() {
  gid = 0;
  if (!PAL[o.season]) o.season = "auto";
  const p = weekData().p;
  document.documentElement.style.setProperty("--band", p.band);
  document.getElementById("app").innerHTML = views[state.tab]();
  document.getElementById("tabs").innerHTML = TABS.map(([k,l]) => `<button class="${state.tab===k?"on":""}" data-tab="${k}">${IC[k]}<span>${l}</span></button>`).join("");
}

// ---------- photos ----------
function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const s = Math.min(1, 720 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", .72)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

// ---------- events ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-free],[data-tab],[data-pick],[data-wk],[data-done],[data-swap],[data-invite],[data-rmphoto],[data-del],[data-del2],[data-ftab],[data-clear]");
  if (!b) return;
  const ds = b.dataset;
  if (ds.free) { o.budget.freeOnly = !o.budget.freeOnly; save(); }
  else if (ds.tab) { state.tab = ds.tab; save(); if (ds.go) document.getElementById(ds.go)?.scrollIntoView(); else window.scrollTo(0,0); }
  else if (ds.pick) { sel = +ds.pick; anim = true; render(); anim = false; if (ds.top) window.scrollTo({top:0, behavior:"smooth"}); }
  else if (ds.wk) { o.week += +ds.wk; sel = 0; render(); }
  else if (ds.done) { o.done[ds.done] = !o.done[ds.done]; save(); }
  else if (ds.swap) { o.swap[ds.swap] = (o.swap[ds.swap]||0) + 1; save(); }
  else if (ds.rmphoto) { delete o.photos[ds.rmphoto]; save(); }
  else if (ds.del) { const [l, id] = ds.del.split(":"); o[l] = o[l].filter(x => x.id !== id); save(); }
  else if (ds.del2) { const [l, id] = ds.del2.split(":"); state[l] = state[l].filter(x => x.id !== id); save(); }
  else if (ds.ftab) { state.ftab = ds.ftab; save(); }
  else if (ds.clear) { state.shopping = state.shopping.filter(x => !x.done); save(); }
  else if (ds.invite) {
    const d = weekData().days[+ds.invite];
    const msg = `Hi! We're going to ${d.a.title} on ${d.name} (${fmt(d.dt)}). Want to bring the kids and join us?`;
    toast(msg, "Copying…");
    try { navigator.clipboard.writeText(msg).then(() => document.getElementById("tst").textContent = "Copied! Paste it into a text to her.", () => document.getElementById("tst").textContent = "Press and hold the message to copy it."); }
    catch (err) { document.getElementById("tst").textContent = "Press and hold the message to copy it."; }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.photo && t.files[0]) { try { o.photos[t.dataset.photo] = await shrink(t.files[0]); save(); } catch (err) { toast("That photo couldn't be opened. Try another one.", ""); } }
  else if (t.dataset.tog) { const [l, id] = t.dataset.tog.split(":"); const x = state[l].find(x => x.id === id); if (x) { x.done = !x.done; save(); } }
  else if (t.dataset.season) { o.season = t.value; save(); }
});
document.addEventListener("submit", async e => {
  const fm = e.target.closest("form[data-f]"); if (!fm) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(fm)); const k = fm.dataset.f;
  if (k === "loc") { o.city = v.city.trim(); o.st = v.st.trim(); state.tab = "week"; }
  if (k === "friend") o.friends.push({id:uid(), name:v.name, note:v.note});
  if (k === "fav") { let photo = ""; if (v.photo && v.photo.size) { try { photo = await shrink(v.photo); } catch (err) {} } o.favs.push({id:uid(), name:v.name, day:v.day, season:v.season, note:v.note, photo, cost:+v.cost||0}); }
  if (k === "budget") { o.budget = {week:Math.max(0, +v.week || 0), day:Math.max(0, +v.day || 0), freeOnly:!!v.freeOnly}; state.tab = "week"; }
  if (k === "spend") { const a = Math.max(0, +v.amt || 0); if (a) o.spent[fm.dataset.key] = Math.round(a*100)/100; else delete o.spent[fm.dataset.key]; }
  if (k === "event") state.events.push({id:uid(), title:v.title, date:v.date, time:v.time, who:v.who});
  if (k === "chore") state.chores.push({id:uid(), title:v.title, who:v.who, done:false});
  if (k === "item") state.shopping.push({id:uid(), title:v.title, done:false});
  if (k === "member") state.members.push({id:uid(), name:v.name, color:COLORS[state.members.length % COLORS.length]});
  save();
});
render();
}
</script>
</body>
</html>
